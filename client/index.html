<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0f2d27"
    />

    <title>Unwind | Mental Wellness & Self-Care</title>

    <meta
      name="description"
      content="Unwind is a privacy-focused mental wellness platform for journaling, wellness tracking, supportive AI conversations, self-assessment, and community connection."

    <meta
      name="author"
      content="Unwind"
    />

    <!-- Search Engine -->
    <meta
      name="robots"

      rel="icon"

      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Unwind | Mental Wellness & Self-Care"

    <meta
      property="og:description"

      property="og:url"
      content="https://project-unwind-mu.vercel.app/"

      content="Unwind"
    />

      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Unwind | Mental Wellness & Self-Care"
    />

    <meta
      name="twitter:description"
      content="A privacy-focused space for journaling, wellness tracking, supportive AI conversations, self-reflection, and community connection."
    />
