name: Unwind CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unwind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          find src test -type f -name "*.js" -print0 |
          xargs -0 -n1 node --check

      - name: Run backend security tests
        run: npm test

  client-checks:
    name: Client checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Run client utility tests
        run: npm test

      - name: Build client
        run: npm run build
        env:
          VITE_API_URL: https://example.com/api
          VITE_POSTHOG_PROJECT_TOKEN: example_ci_token
          VITE_POSTHOG_HOST: https://us.i.posthog.com